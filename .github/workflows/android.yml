name: Android build and release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 installs current command-line tools (22.0) instead of the old
      # 16.0 tools used by setup-android@v3 in the failed run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset."
            exit 1
          fi
          echo "Using Android SDK at: $SDK_ROOT"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error title=Missing API_BASE_URL::Create API_BASE_URL under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          python - "$API_BASE_URL" <<'PYURL'
          import sys
          from urllib.parse import urlparse
          value = sys.argv[1].strip()
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("API_BASE_URL must be an HTTPS backend origin.")
          if parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("API_BASE_URL must not include /api/v1, a query, or a fragment.")
          if not value.endswith("/"):
              raise SystemExit("API_BASE_URL must end with /.")
          print(f"Backend URL injected into APK: {parsed.scheme}://{parsed.netloc}/")
          PYURL

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug \
            -PAPI_BASE_URL="${API_BASE_URL}" \
            -PFIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            -PFIREBASE_APP_ID="${FIREBASE_APP_ID}" \
            -PFIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            -PFIREBASE_SENDER_ID="${FIREBASE_SENDER_ID}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuricoofe-debug-apk-v1.5.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK (permanent signature required)
        id: release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error title=Missing release signing key::Create the four ANDROID_* GitHub Actions secrets using docs/RELEASE_SIGNING.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cafeteria-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cafeteria-release.jks" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/cafeteria-release.jks"
          gradle --no-daemon assembleRelease \
            -PAPI_BASE_URL="${API_BASE_URL}" \
            -PFIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            -PFIREBASE_APP_ID="${FIREBASE_APP_ID}" \
            -PFIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            -PFIREBASE_SENDER_ID="${FIREBASE_SENDER_ID}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          echo "Release APK firmado y verificado con la clave permanente configurada."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: yuricoofe-release-signed-apk-v1.5.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
